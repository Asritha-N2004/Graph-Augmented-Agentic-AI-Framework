services:
  - type: web
    name: cirp-api
    runtime: docker
    dockerfilePath: backend/Dockerfile.render
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: ENABLE_TRAINING_API
        value: 'false'
      - key: BACKEND_API_KEY
        generateValue: true
